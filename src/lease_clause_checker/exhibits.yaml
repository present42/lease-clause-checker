# The closed-book answers the explorer's opening view replays, the first one large; the README
# leads with the first. `make report` and `lcc site` refuse each unless its verdict is right and
# the hand check found that its quote changes what the Act says and would mislead on the clause,
# and unless its punchline starts by stating that verdict. `tag` marks one list item of the
# Act's subsection with a note.
- model: gemini-3.8-flash
  clause: c09
  label: Dropped the limits
  punchline: >-
    Verdict: allowed, right. Read alone, the quote lets a landlord walk in at any time; the Act
    allows entry at any time without written notice only in an emergency or with the tenant's
    consent.
- model: claude-opus-5-5
  clause: c26
  label: Quoted the wrong rule
  punchline: >-
    Verdict: void, right. The clause is about automatic debit; the quote is the rule on
    post-dated cheques, and it drops 'nor a tenancy agreement'.
  tag:
    item: (b)
    note: what this clause is about
- model: claude-haiku-5-5
  clause: c29
  label: Turned a condition into a ban
  punchline: >-
    Verdict: allowed, right. Read alone, the quote bans rent increases outright; s. 116(1) only
    requires at least 90 days' written notice first.
