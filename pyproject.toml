[project]
name = "lease-clause-checker"
version = "0.1.0"
description = "Evaluating whether LLMs can correctly judge Ontario residential lease clauses, with citations checked in code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "beautifulsoup4>=4.15.0",
    "google-genai>=3.1.0",
    "httpx>=0.28.1",
    "mcp==2.3.0",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
lcc = "lease_clause_checker.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "PT",  # pytest style
    "RUF", # ruff-specific
]
# Statute text uses typographic quotes; tests must match them exactly.
allowed-confusables = ["’", "“", "”"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: makes real network or API calls (may cost money); run with `uv run pytest -m live`",
]
